<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Forgot Password | Campus Life Express (CLX)</title><meta name="description" content="Request a secure Campus Life Express password reset link."><link rel="canonical" href="https://clx.dandalinsauki.com/forgot-password"><link rel="icon" href="./images/clx.png" type="image/png"><link rel="stylesheet" href="./css/main.css"><style>.auth-page{min-height:100vh;background:#F8FAFC;display:flex;align-items:center;padding:32px 16px}.auth-card{width:min(100%,480px);margin:auto;background:#fff;border:1px solid var(--gray-200);border-radius:20px;padding:32px;box-shadow:0 8px 24px rgba(0,0,0,.05)}h1{text-align:center;color:var(--gray-900);font-size:25px;margin:0 0 8px}.intro{text-align:center;color:var(--gray-500);font-size:14px;margin:0 0 24px}.field label{display:block;font-size:13px;font-weight:700;color:var(--gray-700);margin-bottom:6px}.field input{width:100%;height:46px;border:1px solid var(--gray-300);border-radius:10px;padding:0 12px;font:inherit}.message{display:none;padding:11px 12px;border-radius:9px;margin-bottom:16px;font-size:13px}.message.error{display:block;background:#FEF2F2;color:#B91C1C}.message.success{display:block;background:#F0FDF4;color:#166534}.footer{text-align:center;color:var(--gray-500);font-size:13px;margin-top:20px}.footer a{color:var(--color-primary);font-weight:700}</style></head><body class="auth-page"><main class="auth-card"><a href="/" style="display:block;text-align:center;margin-bottom:20px;"><img src="./images/clx.png" alt="Campus Life Express" style="height:48px;max-width:180px;object-fit:contain;"></a><h1>Reset your password</h1><p class="intro">Enter your email and we will send a secure reset link if an account exists.</p><div id="message" class="message" role="alert" aria-live="polite"></div><form id="form"><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required></div><button id="button" type="submit" class="btn btn-primary" style="width:100%;height:46px;border:0;border-radius:10px;background:var(--color-primary);color:#fff;font-weight:700;cursor:pointer;margin-top:18px;">Send Reset Link</button></form><p class="footer"><a href="/login">Back to Sign In</a></p></main><script type="module">import{sendPasswordReset,authMessage}from'./js/auth.js';const form=document.getElementById('form'),message=document.getElementById('message'),button=document.getElementById('button');function show(text,type='error'){message.textContent=text;message.className=`message ${type}`}form.addEventListener('submit',async e=>{e.preventDefault();if(!form.checkValidity()){show('Enter a valid email address.');return}button.disabled=true;button.textContent='Sending...';try{await sendPasswordReset(document.getElementById('email').value);show('If an account exists for this email, a password reset link has been sent.','success');form.reset()}catch(error){show(authMessage(error,'We could not send the reset link. Please try again.'))}finally{button.disabled=false;button.textContent='Send Reset Link'}});</script></body></html>
