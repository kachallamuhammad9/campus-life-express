<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Campus Life Express (CLX)</title><meta name="description" content="Create a Campus Life Express customer account."><link rel="canonical" href="https://clx.dandalinsauki.com/signup"><link rel="icon" href="./images/clx.png" type="image/png"><link rel="stylesheet" href="./css/main.css">
    <style>.auth-page{min-height:100vh;background:#F8FAFC;display:flex;align-items:center;padding:32px 16px}.auth-card{width:min(100%,520px);margin:auto;background:#fff;border:1px solid var(--gray-200);border-radius:20px;padding:32px;box-shadow:0 8px 24px rgba(0,0,0,.05)}.auth-card h1{text-align:center;color:var(--gray-900);font-size:25px;margin:0 0 8px}.intro{text-align:center;color:var(--gray-500);font-size:14px;margin:0 0 24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:15px}.field.full{grid-column:1/-1}.field label{display:block;font-size:13px;font-weight:700;color:var(--gray-700);margin-bottom:6px}.field input,.field select{width:100%;height:44px;border:1px solid var(--gray-300);border-radius:10px;padding:0 11px;font:inherit;background:#fff}.message{display:none;padding:11px 12px;border-radius:9px;margin-bottom:16px;font-size:13px}.message.error{display:block;background:#FEF2F2;color:#B91C1C}.message.success{display:block;background:#F0FDF4;color:#166534}.footer{text-align:center;color:var(--gray-500);font-size:13px;margin-top:20px}.footer a{color:var(--color-primary);font-weight:700;text-decoration:none}.password{position:relative}.password input{padding-right:70px}.password button{position:absolute;right:8px;top:6px;height:32px;border:0;background:transparent;color:var(--color-primary);font-weight:700;cursor:pointer}@media(max-width:520px){.auth-card{padding:24px 18px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}</style>
</head>
<body class="auth-page"><main class="auth-card"><a href="/" style="display:block;text-align:center;margin-bottom:20px;"><img src="./images/clx.png" alt="Campus Life Express" style="height:48px;max-width:180px;object-fit:contain;"></a><h1>Create your CLX account</h1><p class="intro">Save your profile and access your customer order history.</p><div id="message" class="message" role="alert" aria-live="polite"></div><form id="signup-form" novalidate><div class="grid"><div class="field full"><label for="full-name">Full name</label><input id="full-name" autocomplete="name" required minlength="2"></div><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="phone">Phone / WhatsApp number</label><input id="phone" type="tel" autocomplete="tel" required placeholder="+234 801 234 5678"></div><div class="field"><label for="user-type">User type</label><select id="user-type" required><option value="">Select one</option><option value="student">Student</option><option value="staff">Staff</option><option value="visitor">Visitor</option></select></div><div class="field"><label for="campus">Campus</label><select id="campus" required><option value="unimaid">University of Maiduguri (UNIMAID)</option></select></div><div class="field"><label for="password">Password</label><div class="password"><input id="password" type="password" autocomplete="new-password" required><button type="button" data-toggle-password="password">Show</button></div></div><div class="field"><label for="confirm-password">Confirm password</label><div class="password"><input id="confirm-password" type="password" autocomplete="new-password" required><button type="button" data-toggle-password="confirm-password">Show</button></div></div></div><button id="submit-button" type="submit" class="btn btn-primary" style="width:100%;height:46px;border:0;border-radius:10px;background:var(--color-primary);color:#fff;font-weight:700;cursor:pointer;margin-top:6px;">Create Account</button></form><p class="footer">Already registered? <a id="login-link" href="/login">Sign in</a></p></main><script type="module">import { signUp, getCurrentUser, authMessage, getPasswordError, safeReturnTo } from './js/auth.js';const form=document.getElementById('signup-form'),message=document.getElementById('message'),button=document.getElementById('submit-button'),returnTo=safeReturnTo(new URLSearchParams(location.search).get('returnTo'),'/account');document.getElementById('login-link').href=`/login?returnTo=${encodeURIComponent(returnTo)}`;function show(text,type='error'){message.textContent=text;message.className=`message ${type}`}document.querySelectorAll('[data-toggle-password]').forEach(toggle=>toggle.addEventListener('click',()=>{const input=document.getElementById(toggle.dataset.togglePassword);input.type=input.type==='password'?'text':'password';toggle.textContent=input.type==='password'?'Show':'Hide'}));getCurrentUser().then(user=>{if(user)location.replace(returnTo)});form.addEventListener('submit',async event=>{event.preventDefault();const fullName=document.getElementById('full-name').value.trim(),email=document.getElementById('email').value.trim(),phone=document.getElementById('phone').value.trim(),userType=document.getElementById('user-type').value,campusId=document.getElementById('campus').value,password=document.getElementById('password').value,confirmation=document.getElementById('confirm-password').value;if(!form.checkValidity()){show('Complete all required fields with valid information.');return}if(!/^[+]?[\d ()-]{7,20}$/.test(phone)){show('Enter a valid phone number.');return}const passwordError=getPasswordError(password,confirmation);if(passwordError){show(passwordError);return}button.disabled=true;button.textContent='Creating account...';try{const result=await signUp({fullName,email,phone,userType,campusId});if(result.session){show('Account created successfully.','success');location.replace(returnTo)}else{show('Account created. Check your email to confirm your address, then sign in.','success');button.textContent='Account Created'}}catch(error){show(authMessage(error,'We could not create your account. Please try again.'));button.disabled=false;button.textContent='Create Account'}});</script></body></html>
