<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Set New Password | Campus Life Express (CLX)</title><meta name="description" content="Set a new secure password for your Campus Life Express account."><link rel="canonical" href="https://clx.dandalinsauki.com/reset-password"><link rel="icon" href="./images/clx.png" type="image/png"><link rel="stylesheet" href="./css/main.css"><style>.auth-page{min-height:100vh;background:#F8FAFC;display:flex;align-items:center;padding:32px 16px}.auth-card{width:min(100%,480px);margin:auto;background:#fff;border:1px solid var(--gray-200);border-radius:20px;padding:32px;box-shadow:0 8px 24px rgba(0,0,0,.05)}h1{text-align:center;color:var(--gray-900);font-size:25px;margin:0 0 8px}.intro{text-align:center;color:var(--gray-500);font-size:14px;margin:0 0 24px}.field{margin-bottom:16px}.field label{display:block;font-size:13px;font-weight:700;color:var(--gray-700);margin-bottom:6px}.field input{width:100%;height:46px;border:1px solid var(--gray-300);border-radius:10px;padding:0 12px;font:inherit}.password{position:relative}.password input{padding-right:70px}.password button{position:absolute;right:8px;top:6px;height:32px;border:0;background:transparent;color:var(--color-primary);font-weight:700;cursor:pointer}.message{display:none;padding:11px 12px;border-radius:9px;margin-bottom:16px;font-size:13px}.message.error{display:block;background:#FEF2F2;color:#B91C1C}.message.success{display:block;background:#F0FDF4;color:#166534}.footer{text-align:center;color:var(--gray-500);font-size:13px;margin-top:20px}.footer a{color:var(--color-primary);font-weight:700}</style></head><body class="auth-page"><main class="auth-card"><a href="/" style="display:block;text-align:center;margin-bottom:20px;"><img src="./images/clx.png" alt="Campus Life Express" style="height:48px;max-width:180px;object-fit:contain;"></a><h1>Set a new password</h1><p class="intro">Choose a new password for your CLX account.</p><div id="message" class="message" role="alert" aria-live="polite"></div><form id="form"><div class="field"><label for="password">New password</label><div class="password"><input id="password" type="password" autocomplete="new-password" required><button type="button" data-toggle="password">Show</button></div></div><div class="field"><label for="confirmation">Confirm new password</label><div class="password"><input id="confirmation" type="password" autocomplete="new-password" required><button type="button" data-toggle="confirmation">Show</button></div></div><button id="button" type="submit" class="btn btn-primary" style="width:100%;height:46px;border:0;border-radius:10px;background:var(--color-primary);color:#fff;font-weight:700;cursor:pointer;">Update Password</button></form><p class="footer"><a href="/login">Back to Sign In</a></p></main><script type="module">import{getSession,updatePassword,getPasswordError,authMessage}from'./js/auth.js';const form=document.getElementById('form'),message=document.getElementById('message'),button=document.getElementById('button');function show(text,type='error'){message.textContent=text;message.className=`message ${type}`}document.querySelectorAll('[data-toggle]').forEach(toggle=>toggle.addEventListener('click',()=>{const input=document.getElementById(toggle.dataset.toggle);input.type=input.type==='password'?'text':'password';toggle.textContent=input.type==='password'?'Show':'Hide'}));getSession().then(result=>{if(!result.user)show('This reset link is invalid or expired. Request a new link.');});form.addEventListener('submit',async e=>{e.preventDefault();const error=getPasswordError(document.getElementById('password').value,document.getElementById('confirmation').value);if(error){show(error);return}button.disabled=true;button.textContent='Updating...';try{await updatePassword(document.getElementById('password').value);show('Your password has been updated. You can now sign in.','success');form.reset();button.textContent='Password Updated'}catch(error){show(authMessage(error,'This reset link is invalid or expired. Request a new link.'));button.disabled=false;button.textContent='Update Password'}});</script></body></html>
